name: Build Windows Installer

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache Electron Builder
        uses: actions/cache@v4
        with:
          path: |
            ~/AppData/Local/electron-builder/Cache
            ~/AppData/Roaming/electron-builder/Cache
          key: electron-builder-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-builder-${{ runner.os }}-

      - name: Install dependencies
        run: npm install

      - name: Build unpacked app
        shell: cmd
        run: npx electron-builder --win --dir
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Build NSIS installer
        shell: cmd
        run: npx electron-builder --win nsis --prepackaged dist/win-unpacked
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Drive-Relief-Setup
          path: dist/*.exe
          if-no-files-found: error
