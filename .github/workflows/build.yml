name: Build Windows Installer

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Debug info
        run: |
          node -v
          npm -v
          npx electron-builder --version

      - name: Build Electron app
        id: build
        run: |
          $ErrorActionPreference = 'Continue'
          try {
            npm run dist -- --verbose 2>&1 | Tee-Object -Variable buildOutput
          } catch {
            $buildOutput = $_.Exception.Message
          }
          echo "## Build Output" >> $env:GITHUB_STEP_SUMMARY
          echo '```' >> $env:GITHUB_STEP_SUMMARY
          $buildOutput | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          echo '```' >> $env:GITHUB_STEP_SUMMARY
          if ($LASTEXITCODE -ne 0) {
            echo "Build failed with exit code $LASTEXITCODE" >> $env:GITHUB_STEP_SUMMARY
            exit 1
          }
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          GH_TOKEN: ""

      - name: Upload installer
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Drive-Relief-Setup
          path: dist/*.exe
          if-no-files-found: error
