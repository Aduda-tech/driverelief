name: Build Windows Installer

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Verify build files
        run: |
          node -e "const p=require('./package.json'); console.log('main:', p.main); console.log('build:', JSON.stringify(p.build.win))"
          if (Test-Path assets/icon.ico) { Write-Output "icon.ico exists" } else { Write-Output "icon.ico MISSING" }

      - name: Build Electron app
        run: |
          npx electron-builder --win --verbose 2>&1
        shell: cmd

      - name: Upload installer
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Drive-Relief-Setup
          path: dist/*.exe
          if-no-files-found: error
